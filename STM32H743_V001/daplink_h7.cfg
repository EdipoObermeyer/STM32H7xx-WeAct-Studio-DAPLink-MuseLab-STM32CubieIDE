# Interface CMSIS-DAP (DAPLink)
source [find interface/cmsis-dap.cfg]
transport select swd

# Velocidade do adaptador (reduza para 1000 se usar fios longos)
adapter speed 4000

# Variável exigida pelo script target/stm32h7x.cfg da ST
set AP_NUM 0

# Alvo STM32H7x
source [find target/stm32h7x.cfg]

# Configuração de Reset
# Se NÃO conectou o pino RST/NRST, mantenha "none"
reset_config none

# Se CONECTOU o pino RST/NRST, comente a linha acima e descomente a linha abaixo:
# reset_config srst_only srst_nogate connect_assert_srst

# Garante que o microcontrolador continue rodando após encerrar o debug
lappend pre_shutdown_commands { resume }